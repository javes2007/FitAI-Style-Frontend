name: Validate FitAI storefront frontend

on:
  push:
    branches: ["main", "feat/compras-reales"]
  pull_request:
    branches: ["main"]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check storefront JavaScript
        run: node --check js/tienda.js
