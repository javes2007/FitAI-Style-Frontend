name: Validate commerce frontend

on:
  push:
    branches: [main, "feat/commerce-integrations"]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check storefront JavaScript syntax
        run: node --check js/tienda.js
