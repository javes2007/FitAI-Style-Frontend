<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Avatar 3D | FitAI Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/avatar-studio.css">
  <link rel="stylesheet" href="css/javes.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}
  </script>
</head>
<body class="avatar-studio">
  <header class="header">
    <a class="logo" href="index.html"><span class="logo-mark">F</span><span>FitAI</span></a>
    <nav aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="avatar.html" class="activo">Avatar IA</a>
      <a href="ropa.html">Ropa</a>
      <a href="modelos.html">Modelos</a>
      <a href="precios.html">Precios</a>
      <a href="contactos.html">Contacto</a>
    </nav>
    <span class="btn-login auth-user-display" data-auth-user hidden aria-live="polite"></span>
  </header>

  <main class="avatar-layout">
    <section class="stage" aria-label="Vista previa del Avatar 3D">
      <div class="stage-top">
        <div>
          <span class="stage-kicker">FITAI</span>
          <strong>Avatar Studio</strong>
        </div>
        <span id="avatarRuntimeStatus" role="status" aria-live="polite">Cargando Avatar 3D…</span>
      </div>

      <div id="scene"></div>

      <div class="view-tools" aria-label="Controles de vista">
        <button type="button" onclick="view('front')" aria-label="Vista frontal">Frente</button>
        <button type="button" onclick="view('side')" aria-label="Vista lateral">Perfil</button>
        <button type="button" onclick="zoomAvatar(0.72)" aria-label="Acercar">＋</button>
        <button type="button" onclick="zoomAvatar(1.38)" aria-label="Alejar">−</button>
        <button type="button" onclick="resetAvatarView()" aria-label="Restablecer vista">⛶</button>
      </div>

      <div class="stage-hint">Arrastra para rotar · pellizca o usa rueda para zoom</div>
    </section>

    <section class="controls" aria-label="Controles del avatar">
      <div class="controls-title">
        <div>
          <span class="eyebrow">PERSONALIZACIÓN</span>
          <h1>Avatar Studio</h1>
        </div>
        <span class="online-dot" aria-hidden="true"></span>
      </div>

      <div class="accordion-list">
        <section class="accordion" data-accordion>
          <button class="accordion-trigger" type="button" aria-expanded="false">
            <span><span class="accordion-icon">01</span>Edad</span><span class="chevron">⌄</span>
          </button>
          <div class="accordion-panel">
            <div class="number-control">
              <label for="ageNumber">Edad</label>
              <div class="number-row">
                <input id="ageNumber" class="number-input" type="number" min="0" max="100" value="25" inputmode="numeric">
                <span>años</span>
              </div>
            </div>
            <input id="age" type="range" min="0" max="100" value="25" aria-label="Edad">
          </div>
        </section>

        <section class="accordion" data-accordion>
          <button class="accordion-trigger" type="button" aria-expanded="false">
            <span><span class="accordion-icon">02</span>Altura</span><span class="chevron">⌄</span>
          </button>
          <div class="accordion-panel">
            <div class="number-control">
              <label for="heightNumber">Altura</label>
              <div class="number-row">
                <input id="heightNumber" class="number-input" type="number" min="145" max="200" value="168" inputmode="numeric">
                <span>cm</span>
              </div>
            </div>
            <input id="height" type="range" min="145" max="200" value="168" aria-label="Altura">
          </div>
        </section>

        <section class="accordion" data-accordion>
          <button class="accordion-trigger" type="button" aria-expanded="false">
            <span><span class="accordion-icon">03</span>Cuerpo</span><span class="chevron">⌄</span>
          </button>
          <div class="accordion-panel">
            <div class="slider-field"><label for="body">Tipo de cuerpo <span class="value" id="bodyV">50</span></label><input id="body" type="range" min="20" max="80" value="50"></div>
            <div class="slider-field"><label for="shoulder">Hombros <span class="value" id="shoulderV">50</span></label><input id="shoulder" type="range" min="30" max="75" value="50"></div>
            <div class="slider-field"><label for="waist">Cintura <span class="value" id="waistV">50</span></label><input id="waist" type="range" min="30" max="70" value="50"></div>
          </div>
        </section>

        <section class="accordion" data-accordion>
          <button class="accordion-trigger" type="button" aria-expanded="false">
            <span><span class="accordion-icon">04</span>Rostro</span><span class="chevron">⌄</span>
          </button>
          <div class="accordion-panel">
            <div class="slider-field"><label for="face">Forma del rostro <span class="value" id="faceV">50</span></label><input id="face" type="range" min="30" max="70" value="50"></div>
            <div class="slider-field"><label for="eyes">Tamaño de ojos <span class="value" id="eyesV">50</span></label><input id="eyes" type="range" min="30" max="70" value="50"></div>
          </div>
        </section>

        <section class="accordion" data-accordion>
          <button class="accordion-trigger" type="button" aria-expanded="false">
            <span><span class="accordion-icon">05</span>Cabello</span><span class="chevron">⌄</span>
          </button>
          <div class="accordion-panel">
            <div class="selectrow">
              <button type="button" class="chip active" onclick="hair(0,this)">Largo</button>
              <button type="button" class="chip" onclick="hair(1,this)">Corto</button>
              <button type="button" class="chip" onclick="hair(2,this)">Cola</button>
            </div>
          </div>
        </section>

        <section class="accordion" data-accordion>
          <button class="accordion-trigger" type="button" aria-expanded="false">
            <span><span class="accordion-icon">06</span>Estética</span><span class="chevron">⌄</span>
          </button>
          <div class="accordion-panel">
            <div class="selectrow style-chips">
              <button type="button" class="chip active">NEÓN</button>
              <button type="button" class="chip">CYBERPUNK</button>
              <button type="button" class="chip">SPACE</button>
              <button type="button" class="chip">MINIMAL</button>
            </div>
          </div>
        </section>

        <section class="accordion" data-accordion>
          <button class="accordion-trigger" type="button" aria-expanded="false">
            <span><span class="accordion-icon">07</span>Foto</span><span class="chevron">⌄</span>
          </button>
          <div class="accordion-panel">
            <p class="upload-hint">Sube una foto de cuerpo completo, de frente y con buena luz para que JAVES calcule tus proporciones.</p>
            <label class="upload" for="photoInput">📷 Subir foto<input id="photoInput" type="file" accept="image/*" hidden></label>
            <img id="photo" class="photo" alt="Foto seleccionada">
            <p id="photoStatus" class="photo-status"></p>
          </div>
        </section>
      </div>

      <button class="reset-btn" type="button" onclick="resetAvatar()">↺ Restablecer valores</button>
    </section>
  </main>

  <script>
    window.addEventListener("error", event => {
      console.error("[FITAI Avatar] Error global:", event.error || event.message);
      const box = document.getElementById("avatarRuntimeStatus");
      if (box && event.message) box.textContent = "⚠ Error cargando Avatar 3D. Abre F12 → Console.";
    });
    window.addEventListener("unhandledrejection", event => {
      console.error("[FITAI Avatar] Error de módulo/promesa:", event.reason);
      const box = document.getElementById("avatarRuntimeStatus");
      if (box) box.textContent = "⚠ No se pudo cargar el motor 3D. Abre F12 → Console.";
    });
  </script>
  <script type="module" src="js/firebase-auth.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/avatar3D.js"></script>
  <script src="js/javes.js"></script>
  <script src="js/navigation.js"></script>
</body>
</html>
